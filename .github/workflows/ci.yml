name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eshor
          POSTGRES_PASSWORD: eshor_ci
          POSTGRES_DB: eshor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eshor -d eshor_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate eshor_core spine schema (outbox/ledger/reservations/state machine)
        # Found missing 2026-07-19 while proof-of-work-auditing this
        # workflow against a genuinely fresh, never-migrated database
        # (this job's own Postgres service, same as CI's): without this,
        # every DB-backed kernel test fails with "relation eshor_core.*
        # does not exist" -- packages/kernel's raw SQL migrations are
        # deliberately separate from Medusa's own migration system (see
        # migrate.mts's own comment) and were never wired into CI, only
        # documented as a manual local-dev step in README. This also
        # creates the eshor_app role the ledger-immutability test
        # connects as (see DATABASE_URL_LEDGER_TEST below).
        run: pnpm --filter @eshor/kernel migrate
        env:
          DATABASE_URL: postgres://eshor:eshor_ci@localhost:5432/eshor_test
      - name: Lint (includes money rule)
        run: pnpm lint
      - name: Typecheck
        # Scopes to packages that define a "typecheck" script (currently
        # kernel + image-pipeline; verified 2026-07-17). apps/backend and
        # apps/storefront intentionally don't define one yet -- the
        # vendored Next.js starter carries ~335 pre-existing React
        # 19/Radix UI type errors unrelated to any eshor code (confirmed
        # by isolating our own files, which are clean). Do not add a
        # "typecheck" script to apps/storefront/package.json until that
        # is fixed, or this gate will start failing on vendor noise.
        run: pnpm typecheck
      - name: Tests (unit + property + race suites)
        run: pnpm test
        env:
          DATABASE_URL: postgres://eshor:eshor_ci@localhost:5432/eshor_test
          # eshor_app is a deliberately-limited Postgres role (created by
          # the migration above) that can INSERT/SELECT on the ledger but
          # not UPDATE/DELETE -- the ledger-immutability test connects as
          # this role to prove append-only is DB-enforced, not just
          # app-code-enforced. Password matches migrations/001's literal
          # CREATE ROLE (same value README documents for local dev).
          DATABASE_URL_LEDGER_TEST: postgres://eshor_app:eshor_app_dev@localhost:5432/eshor_test
          REDIS_URL: redis://localhost:6379
      - name: Backend module-integration tests (real Postgres)
        # medusaIntegrationTestRunner creates + self-migrates its own
        # scratch database per run (confirmed from the installed
        # @medusajs/test-utils source) -- no separate `medusa db:migrate`
        # step needed, just a reachable Postgres the CI role can
        # CREATE DATABASE on.
        run: pnpm --filter @eshor/backend test:integration:modules
        env:
          DATABASE_URL: postgres://eshor:eshor_ci@localhost:5432/eshor_test
          REDIS_URL: redis://localhost:6379
      - name: Backend HTTP integration tests (real Postgres)
        run: pnpm --filter @eshor/backend test:integration:http
        env:
          DATABASE_URL: postgres://eshor:eshor_ci@localhost:5432/eshor_test
          REDIS_URL: redis://localhost:6379
      - name: Prove the money-lint and boot-guard gates actually fail bad code
        run: bash scripts/prove-gates.sh

  # Perf budgets (Layer 3): PLP/PDP total-byte-weight <=500KB, LCP <5s
  # @1.6Mbps throttle. Verified locally against real Chromium 2026-07-17:
  # home 221KB/1985ms, PLP 279KB/2623ms, PDP 265KB/2140ms -- all green,
  # after removing 4 leftover starter-template sample products whose
  # unoptimized demo images were the actual budget-blowing culprit
  # (2.7MB of a 2.99MB PDP), not anything in eshor's own code.
  #
  # NOTE: this job's YAML has not been executed against real GitHub
  # Actions infrastructure (no CI runner access in this environment) --
  # every other gate in this workflow was run for real; this one is
  # written to the same standard of care but unverified end-to-end on
  # GHA specifically. Chrome is expected pre-installed on ubuntu-latest
  # runners (unlike the WSL dev sandbox, which needed a manual
  # chromium-browser install due to a Windows/Linux interop quirk).
  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eshor
          POSTGRES_PASSWORD: eshor_ci
          POSTGRES_DB: eshor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eshor -d eshor"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://eshor:eshor_ci@localhost:5432/eshor
      REDIS_URL: redis://localhost:6379
      APP_ENV: development
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci_jwt_secret
      COOKIE_SECRET: ci_cookie_secret
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_DEFAULT_REGION: ng
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate backend (Medusa core + eshor_core spine + garmentFit)
        working-directory: apps/backend
        run: |
          npx medusa db:migrate

      - name: Boot backend
        working-directory: apps/backend
        run: |
          npx medusa develop > /tmp/medusa-ci.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -m 2 http://localhost:9000/health > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Backend failed to become healthy"; cat /tmp/medusa-ci.log; exit 1

      - name: Create admin user + publishable key
        working-directory: apps/backend
        # create-pub-key.sh hardcodes admin@eshor.dev / DevAdmin_ChangeMe1
        # (it's a local-dev convenience script, not env-configurable) --
        # matching that exactly here rather than inventing env vars it
        # doesn't read.
        run: |
          npx medusa user -e admin@eshor.dev -p DevAdmin_ChangeMe1
          KEY=$(bash ../../scripts/create-pub-key.sh)
          echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Seed demo catalog (creates NG region + 12 products)
        working-directory: apps/backend
        run: npx medusa exec ./src/scripts/seed-demo.ts

      - name: Seed Nigerian delivery zones
        working-directory: apps/backend
        run: npx medusa exec ./src/scripts/seed-delivery-zones.ts

      - name: Seed delivery-zones fulfillment (shipping option)
        working-directory: apps/backend
        run: npx medusa exec ./src/scripts/seed-delivery-fulfillment.ts

      # link-paystack-to-region.ts intentionally NOT run here: it needs
      # PAYSTACK_SECRET_KEY, which isn't (and shouldn't be) set in this
      # workflow -- apps/backend/.env's real test key is gitignored, and
      # this job never exercises checkout anyway (Lighthouse only hits
      # home/PLP/PDP). Kept in README.md's local-dev steps only, where a
      # developer's own .env already has a real test key.

      - name: Remove starter sample products (the actual Lighthouse fix)
        working-directory: apps/backend
        run: npx medusa exec ./src/scripts/remove-starter-samples.ts

      - name: Build storefront
        working-directory: apps/storefront
        run: npx next build

      - name: Start storefront
        working-directory: apps/storefront
        run: |
          npx next start -p 8000 &
          for i in $(seq 1 60); do
            curl -fsS -m 2 http://localhost:8000/ng > /dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1

      - name: Lighthouse CI (fails the build on budget violation)
        run: npx -y @lhci/cli@0.15 autorun --config=lighthouserc.json
